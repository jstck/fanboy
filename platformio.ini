[platformio]
default_envs = c3

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; ESP32-C3 (e.g. C3 SuperMini). Flash over USB: pio run -e c3 -t upload
[env:c3]
platform = platformio/espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two app slots (OTA) with more room than the default 1.2 MB each.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
extra_scripts = pre:scripts/embed_web.py
lib_deps =
    ${env.lib_deps}
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1

; Same firmware, flashed over WiFi: FANBOY_OTA_PASSWORD=... pio run -e c3-ota -t upload
[env:c3-ota]
extends = env:c3
upload_protocol = espota
upload_port = fanboy.local
upload_flags = --auth=${sysenv.FANBOY_OTA_PASSWORD}

; Fast host-side unit tests of lib/fancore: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
