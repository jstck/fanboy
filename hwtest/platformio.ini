; Hardware test firmware: DS18B20 readout + manual 4-pin fan control.
; Config: copy include/hwtest_config.example.h to include/hwtest_config.h.
; Flash (from the repo root): pio run -d hwtest -t upload && pio device monitor -d hwtest
[platformio]
default_envs = c6

[env:c6]
platform = platformio/espressif32@8.0.0
board = esp32-c6-devkitc-1
; The C6-Zero's ESP32-C6FH4 has 4 MB flash (the DevKitC-1 board definition assumes 8 MB).
; Newer boards with the C6FH8 (8 MB) work with this too.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Same partition table as the main firmware, so switching between them is seamless.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
lib_deps =
    ; OneWireNg instead of paulstoffregen/OneWire, whose 2.3.8 doesn't build for the
    ; ESP32-C6. It provides a drop-in OneWire.h that DallasTemperature uses.
    pstolarz/OneWireNg@0.14.1
    milesburton/DallasTemperature@4.0.6
lib_ignore = OneWire  ; pulled in by DallasTemperature, replaced by OneWireNg
