<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanboy · Test</title>
<style>
:root {
  --bg: #f4f5f7; --card: #fff; --fg: #1d2129; --muted: #6b7280; --line: #e3e6ea;
  --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --warnbg: rgba(180,83,9,.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --card: #1a1e24; --fg: #e6e8eb; --muted: #9aa3ae; --line: #2a3038;
    --accent: #6b9cff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --warnbg: rgba(251,191,36,.10);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
a { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; }
.label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.id { white-space: nowrap; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .03em; margin-top: 2px; user-select: all; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 8px; padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
  background: var(--accent); color: #fff; }
.btn.stop { background: var(--warn); }
.btn.toggle { background: var(--line); color: var(--fg); min-width: 90px; }
.btn.toggle.on { background: var(--ok); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.banner { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: none; }
.banner.active { display: block; background: var(--warnbg); color: var(--warn); border: 1px solid var(--warn); }
.banner.ended { display: block; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset:disabled { opacity: .5; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
input[type=range] { width: 100%; accent-color: var(--accent); padding: 0; border: 0; background: none; margin-top: 10px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.duty { display: flex; align-items: baseline; gap: 6px; }
.duty input { width: 110px; font-size: 26px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; padding: 2px 10px; }
.duty span { font-size: 20px; color: var(--muted); }
label.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.msg { font-size: 13px; } .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fanboy · Test</h1>
    <a href="/">← Main page</a>
  </header>
  <div class="meta" id="meta">connecting…</div>

  <section class="card">
    <div class="row">
      <div>
        <div class="label">Control</div>
        <div class="value" id="ctrl" style="font-size:20px">–</div>
      </div>
      <button class="btn" id="testBtn" disabled>Enable test mode</button>
    </div>
    <div class="banner" id="banner"></div>
  </section>

  <section class="card">
    <div class="tiles">
      <div>
        <div class="label">Temperature</div>
        <div class="value" id="temp">–</div>
        <div class="sub" id="sensor">&nbsp;</div>
        <div class="id" id="sensorId"></div>
      </div>
      <div>
        <div class="label">Fan speed</div>
        <div class="value" id="rpm">–</div>
        <div class="sub" id="tach">&nbsp;</div>
      </div>
      <div>
        <div class="label">Fan output</div>
        <div class="value" id="out">–</div>
        <div class="sub" id="outSub">&nbsp;</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Manual control</h2>
    <fieldset id="manual" disabled>
      <div class="row">
        <div><div class="label">Fan supply</div><div class="sub">High-side switch</div></div>
        <button class="btn toggle" id="sw" type="button">–</button>
      </div>
      <div class="row" style="margin-top:16px">
        <div><div class="label">PWM duty</div><div class="sub" id="pinDuty">&nbsp;</div></div>
        <div class="duty"><input type="number" id="dutyNum" min="0" max="100" step="1"><span>%</span></div>
      </div>
      <input type="range" id="duty" min="0" max="100" step="1">
    </fieldset>
    <div class="hint">Enable test mode to use these. Duty is as seen by the fan, after any inversion.</div>
  </section>

  <section class="card">
    <h2>Fan hardware (saved)</h2>
    <div class="row">
      <label class="chk"><input type="checkbox" id="inv"> Invert PWM output (inverting / open-collector driver)</label>
    </div>
    <div class="row" style="margin-top:12px">
      <label for="ppr">Tach pulses per revolution</label>
      <input type="number" id="ppr" min="1" max="8" step="1" style="width:70px">
    </div>
    <div class="msg" id="hwMsg"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const STATE = {
  idle: "Automatic · idle", fading_in: "Automatic · fading in", regulating: "Automatic · regulating",
  standby: "Automatic · standby", fading_out: "Automatic · fading out", fault: "Automatic · sensor fault",
};
const HEARTBEAT_MS = 1000, POLL_MS = 2000;

let st = null;          // last status
let testOn = false;     // this page believes test mode is active
let ended = "";         // why test mode ended, shown until re-enabled
let dragging = false, pendingDuty = null, sendTimer = null, typeTimer = null, loopTimer = null;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.status = r.status; throw e; }
  return j;
}

// ---------- rendering ----------
function render(s) {
  st = s;
  testOn = s.test.active;
  $("testBtn").disabled = false;
  $("testBtn").textContent = testOn ? "Disable test mode" : "Enable test mode";
  $("testBtn").className = testOn ? "btn stop" : "btn";
  $("ctrl").textContent = testOn ? "Manual (test mode)" : (STATE[s.state] || s.state) + " · mode " + s.mode;

  const b = $("banner");
  if (testOn) {
    b.className = "banner active";
    b.textContent = `Test mode: the PID is paused and you control the fan. Closing or hiding this page returns to automatic control (at the latest ${s.test.leaseMs / 1000} s after the page stops responding).`;
  } else if (ended) {
    b.className = "banner ended";
    b.textContent = ended;
  } else {
    b.className = "banner";
  }

  $("temp").textContent = s.temp == null ? "–" : s.temp.toFixed(2) + " °C";
  $("sensor").textContent = !s.sensorCount ? "No DS18B20 found"
    : s.sensorCount > 1 ? `${s.sensorCount} sensors, using the lowest ID` : (s.sensorFault ? "Sensor not responding" : "Sensor ID");
  $("sensorId").textContent = s.sensorId || "";

  $("rpm").textContent = Math.round(s.rpm) + " rpm";
  $("tach").textContent = `${s.tachHz.toFixed(1)} Hz · ${s.tachPulses} pulses`;

  $("out").textContent = s.fanOn ? Math.round(s.duty) + " %" : "off";
  $("outSub").textContent = s.fanOn ? `GPIO duty ${Math.round(s.pinDuty)} %` : `supply off · PWM ${Math.round(s.duty)} %`;

  // Manual controls show the requested test values while active, else the live output.
  $("manual").disabled = !testOn;
  const on = testOn ? s.test.on : s.fanOn;
  const duty = testOn ? s.test.duty : s.duty;
  $("sw").textContent = on ? "ON" : "OFF";
  $("sw").className = "btn toggle" + (on ? " on" : "");
  if (!dragging && document.activeElement !== $("dutyNum") && pendingDuty === null) {
    $("duty").value = duty;
    $("dutyNum").value = Math.round(duty);
  }
  $("pinDuty").textContent = `GPIO duty ${Math.round(s.pinDuty)} %`;

  const up = s.uptime;
  $("meta").textContent = [s.time || "time not synced", s.ssid ? s.ssid + " (" + s.rssi + " dBm)" : null,
    `up ${Math.floor(up / 3600)}h ${Math.floor(up / 60) % 60}m`].filter(Boolean).join(" · ");
}

function lost(why) {
  testOn = false;
  ended = why;
  if (st) { st.test.active = false; render(st); }
}

// ---------- loop: heartbeat while in test mode, plain status poll otherwise ----------
async function loop() {
  clearTimeout(loopTimer);
  try {
    render(testOn ? await api("/api/test", {}) : await api("/api/status"));
  } catch (e) {
    if (e.status === 409) lost("Test mode timed out (the device stopped hearing from this page), so it went back to automatic control.");
    else $("meta").textContent = "offline (" + e.message + ")";
  }
  clearTimeout(loopTimer);  // another loop() may have run meanwhile: keep only one chain
  loopTimer = setTimeout(loop, testOn ? HEARTBEAT_MS : POLL_MS);
}

async function test(body) {
  try { render(await api("/api/test", body)); }
  catch (e) {
    if (e.status === 409) lost("Test mode had already ended, so control is back to automatic.");
    else $("meta").textContent = "Error: " + e.message;
  }
}

$("testBtn").addEventListener("click", async () => {
  ended = testOn ? "Test mode disabled. Back to automatic control." : "";
  await test({ enable: !testOn });
  loop();  // switch between heartbeat and poll rate right away
});

// Leaving or hiding the page ends test mode at once. Background tabs get their
// timers throttled, so relying on the heartbeat there would be unpredictable.
function endOnLeave(why) {
  if (!testOn) return;
  fetch("/api/test", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: '{"enable":false}' }).catch(() => {});
  lost(why);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") endOnLeave("Test mode ended because the page was hidden. Back to automatic control.");
  else loop();
});
window.addEventListener("pagehide", () => endOnLeave("Test mode ended when the page was left."));

// ---------- manual controls ----------
$("sw").addEventListener("click", () => st && test({ on: !st.test.on }));

// Duty: at most one request per 150 ms while dragging, always the final value.
function setDuty(v) {
  pendingDuty = Number(v);
  if (sendTimer) return;
  sendTimer = setTimeout(async function flush() {
    const d = pendingDuty;
    await test({ duty: d });
    if (pendingDuty !== d) { sendTimer = setTimeout(flush, 150); return; }
    pendingDuty = null; sendTimer = null;
  }, 150);
}
$("duty").addEventListener("pointerdown", () => dragging = true);
window.addEventListener("pointerup", () => dragging = false);
$("duty").addEventListener("input", e => { $("dutyNum").value = e.target.value; setDuty(e.target.value); });

// Text box: applies 400 ms after you stop typing, or at once on Enter / leaving the box.
function dutyFromBox(clamp) {
  clearTimeout(typeTimer);
  const raw = $("dutyNum").value;
  if (raw === "" || isNaN(Number(raw))) return;
  const v = Math.max(0, Math.min(100, Number(raw)));
  if (clamp) $("dutyNum").value = v;
  $("duty").value = v;
  setDuty(v);
}
$("dutyNum").addEventListener("input", () => { clearTimeout(typeTimer); typeTimer = setTimeout(() => dutyFromBox(false), 400); });
$("dutyNum").addEventListener("change", () => dutyFromBox(true));
$("dutyNum").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

// ---------- hardware settings (persistent, via /api/settings) ----------
function fillHw(s) { $("inv").checked = s.pwmInvert; $("ppr").value = s.tachPpr; }
async function saveHw(body) {
  const m = $("hwMsg");
  try {
    fillHw(await api("/api/settings", body));
    m.className = "msg ok"; m.textContent = "Saved";
    setTimeout(() => { if (m.textContent === "Saved") m.textContent = ""; }, 2000);
  } catch (e) {
    m.className = "msg err"; m.textContent = e.message;
    api("/api/settings").then(fillHw).catch(() => {});
  }
}
$("inv").addEventListener("change", e => saveHw({ pwmInvert: e.target.checked }));
$("ppr").addEventListener("change", e => {
  const v = parseInt(e.target.value, 10);
  if (isNaN(v)) { $("hwMsg").className = "msg err"; $("hwMsg").textContent = "Enter a whole number 1–8"; return; }
  saveHw({ tachPpr: v });
});

api("/api/settings").then(fillHw).catch(() => {});
loop();
</script>
</body>
</html>
