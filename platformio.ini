[platformio]
default_envs = c6

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; ESP32-C6 (Waveshare ESP32-C6-Zero). Flash over USB: pio run -e c6 -t upload
[env:c6]
platform = platformio/espressif32@8.0.0
board = esp32-c6-devkitc-1
; The C6-Zero's ESP32-C6FH4 has 4 MB flash (the DevKitC-1 board definition assumes 8 MB).
; Newer boards with the C6FH8 (8 MB) work with this too.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two app slots (OTA) with more room than the default 1.2 MB each.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
extra_scripts = pre:scripts/embed_web.py
lib_deps =
    ${env.lib_deps}
    ; OneWireNg instead of paulstoffregen/OneWire, whose 2.3.8 doesn't build for the
    ; ESP32-C6. It provides a drop-in OneWire.h that DallasTemperature uses.
    pstolarz/OneWireNg@0.14.1
    milesburton/DallasTemperature@4.0.6
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
lib_ignore = OneWire  ; pulled in by DallasTemperature, replaced by OneWireNg

; Same firmware, flashed over WiFi: FANBOY_OTA_PASSWORD=... pio run -e c6-ota -t upload
[env:c6-ota]
extends = env:c6
upload_protocol = espota
upload_port = fanboy.local
upload_flags = --auth=${sysenv.FANBOY_OTA_PASSWORD}

; Fast host-side unit tests of lib/fancore: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
